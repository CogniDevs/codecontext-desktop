name: Build and Release Desktop Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: CodeContext_Windows.exe
            output_file: dist/CodeContext.exe
            core_file: codecontext_core.pyd
          - os: ubuntu-latest
            asset_name: CodeContext_Linux.tar.gz
            output_file: CodeContext_Linux.tar.gz
            core_file: codecontext_core.so
          - os: macos-latest
            asset_name: CodeContext_macOS.zip
            output_file: CodeContext_macOS.zip
            core_file: codecontext_core.so

    steps:
      - name: Checkout desktop runner
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Download UI from codecontext-web
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist_ui
          gh release download latest-ui --repo CogniDevs/codecontext-web --pattern "frontend-dist.zip" --dir /tmp || true
          if [ -f /tmp/frontend-dist.zip ]; then
            unzip -o /tmp/frontend-dist.zip -d dist_ui/
          fi
        shell: bash

      - name: Download Core Library from codecontext-core
        env:
          GH_TOKEN: ${{ secrets.CORE_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo CogniDevs/codecontext-core --pattern "${{ matrix.core_file }}" --dir backend/ || true
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Run PyInstaller build
        run: python build.py

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        run: tar -czvf CodeContext_Linux.tar.gz -C dist CodeContext

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ../CodeContext_macOS.zip CodeContext

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.output_file }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}