name: Build macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS Binary
    runs-on: macos-latest
    steps:
      - name: Checkout desktop
        uses: actions/checkout@v4
        with:
          path: codecontext-desktop

      - name: Checkout core
        uses: actions/checkout@v4
        with:
          repository: CogniDevs/codecontext-core
          token: ${{ secrets.CORE_READ_TOKEN || secrets.GITHUB_TOKEN }}
          path: codecontext-core

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download and Unpack UI bundle
        env:
          GH_TOKEN: ${{ secrets.CORE_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          cd codecontext-desktop
          mkdir -p dist_ui /tmp/extracted_ui
          gh release download latest-ui --repo CogniDevs/codecontext-web --pattern "frontend-dist.zip" --dir /tmp || true
          if [ -f /tmp/frontend-dist.zip ]; then
            unzip -o /tmp/frontend-dist.zip -d /tmp/extracted_ui/
            INDEX_FILE=$(find /tmp/extracted_ui -name "index.html" | head -n 1)
            if [ -n "$INDEX_FILE" ]; then
              cp -r "$(dirname "$INDEX_FILE")"/* dist_ui/
            fi
          fi
        shell: bash

      - name: Build release
        run: |
          cd codecontext-desktop
          cargo build --release

      - name: Package archive
        run: |
          cd codecontext-desktop
          zip -j ../CodeContext_macOS.zip target/release/codecontext-desktop

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeContext_macOS.zip
          path: CodeContext_macOS.zip

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: CodeContext_macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}